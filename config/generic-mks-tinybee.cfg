# Todo: add flashing docs

[stepper_x]
step_pin: SR1
dir_pin: SR2
enable_pin: !SR0
microsteps: 16
rotation_distance: 40
endstop_pin: !GPIO33
position_endstop: 0
position_max: 300
homing_speed: 50
second_homing_speed: 10

[stepper_y]
step_pin: SR4
dir_pin: SR5
enable_pin: !SR3
microsteps: 16
rotation_distance: 40
endstop_pin: !GPIO32
position_endstop: 0
position_max: 300
homing_speed: 50
second_homing_speed: 10

[stepper_z]
step_pin: SR7
dir_pin: SR8
enable_pin: !SR6
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 410
homing_speed: 10
second_homing_speed: 2

[extruder]
step_pin: SR10
dir_pin: SR11
enable_pin: !SR9
microsteps: 16
rotation_distance: 20.925
gear_ratio: 66:22
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: SR17
sensor_type: EPCOS 100K B57560G104F
sensor_pin: GPIO36
control: pid
pid_kp: 20.860
pid_ki: 1.131
pid_kd: 96.218
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: SR16
sensor_type: EPCOS 100K B57560G104F
sensor_pin: GPIO39
control: pid
pid_kp: 42.365
pid_ki: 0.545
pid_kd: 822.940
min_temp: 0
max_temp: 130

[fan]
pin: SR19
off_below: 0.1

[heater_fan extruder]
pin: SR20
off_below: 0.2

#[controller_fan case]
#pin: PC6
#off_below: 0.3
#idle_speed: 0.0

#[temperature_sensor mainboard]
#sensor_type: temperature_mcu
#min_temp: 10
#max_temp: 60

[bltouch]
sensor_pin: GPIO22
control_pin: GPIO2
x_offset:27.25
y_offset:-12.8
z_offset: 1.0
samples: 3
samples_tolerance: 0.050
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 150,150
z_hop: 15

[bed_mesh]
speed: 100
mesh_min: 27.25, 12.8
mesh_max: 272.75, 287.2
algorithm: bicubic
probe_count: 5,5
mesh_pps: 3
fade_end: 10

[bed_screws]
screw1: 50,50
screw1_name: front left
screw2: 250,50
screw2_name: front right
screw3: 250,250
screw3_name: back right
screw4: 50,250
screw4_name: back left
speed: 100.0

[screws_tilt_adjust]
screw1: 23,63
screw1_name: front left
screw2: 223,63
screw2_name: front right
screw3: 223,263
screw3_name: back right
screw4: 23,263
screw4_name: back left
speed: 100.0
screw_thread: CW-M5

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0

#[neopixel extruder]
#pin: PB7
#initial_RED: 1.0
#initial_GREEN: 1.0
#initial_BLUE: 1.0

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 1500
max_z_velocity: 50
max_z_accel: 400
square_corner_velocity: 5.0
